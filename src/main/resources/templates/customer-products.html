<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Bebas+Neue&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="/css/products.css">
</head>
<body>
    <!-- Section 1: Header -->
    <section id="header" class="header">
        <nav>
            <a th:href="@{#}" title="Scroll to top of page"><img src="/images/logo.png" class="logo" alt="Segue Logo"></a>
            <ul>
                <li><a th:href="@{/customer/home}" title="Go to Home Page">Home</a></li>
                <li><a th:href="@{/customer/products}" title="Go to Products Page">Shop</a></li>
                <li><a th:href="@{/customer/orders}" title="Go to Orders Page">Orders</a></li>
            </ul>
            <a th:href="@{/customer/cart}" title="View Cart" aria-label="View Cart"><i class='bx bx-cart' ></i></a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout" title="Log Out" aria-label="Log Out">
                    <i class='bx bx-log-out'></i>
                </button>
            </form>
        </nav>
    </section>

    <main>
        <!-- Section 2: Top 5 Albums -->

        <!-- Section 3: All Albums -->
        <section class="products">
            <h2>Video Game Music Albums</h2>

            <div class="album-grid">
                <div class="album-card" th:each="product: ${productsList}">
                    <a th:href="@{/customer/products/{id}(id=${product.id})}">
                        <img th:src="${product.albumCoverURL}" alt="Album Cover">
                    </a>

                    <h3 th:text="${product.name}"></h3>
                    <p th:text="${product.artist}"></p>
                    <p th:text="'$' + ${product.price}"></p>
                    <a th:href="@{/customer/products/{id}(id=${product.id})}">View Details</a>
                </div>
            </div>
        </section>
    </main>

    <!-- Section 3: Footer -->
    <footer class="footer">
        <p>&copy; 2025 Elvin Jiby</p>
    </footer>
</body>
</html>
