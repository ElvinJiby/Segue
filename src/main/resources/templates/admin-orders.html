<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Bebas+Neue&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="/css/orders.css">
</head>
<body>
    <!-- Section 1: Header -->
    <section id="header" class="header">
        <nav>
            <a th:href="@{#}" title="Scroll to top of page"><img src="/images/logo.png" class="logo" alt="Segue Logo"></a>
            <ul>
                <li><a th:href="@{/admin/home}" title="Go to Home Page">Home</a></li>
                <li><a th:href="@{/admin/products}" title="Go to Products Page">Manage Products</a></li>
                <li><a th:href="@{/admin/orders}" title="Go to Orders Page">Manage Orders</a></li>
            </ul>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout" title="Log Out" aria-label="Log Out">
                    <i class='bx bx-log-out'></i>
                </button>
            </form>
        </nav>
    </section>

    <main>
        <!-- Section 2: Orders -->
        <section class="orders section-box">
            <h2>Manage Orders</h2>
            <table>
                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Items</th>
                    <th>Action</th>
                </tr>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}"></td>
                    <td th:text="${order.customer.username}"></td>
                    <td th:text="${order.orderDate}"></td>
                    <td th:text="${order.status}"></td>
                    <td>
                        <ul>
                            <li th:each="item : ${order.items}">
                                <span th:text="${item.productName} + ' | '"></span>
                                <span th:text="'Amnt: ' + ${item.quantity} + ' | '"></span>
                                <span th:text="'€ ' + ${item.priceAtPurchase}"></span>
                            </li>
                        </ul>
                    </td>
                    <td>
                        <form th:action="@{/admin/orders/update/{id}(id=${order.id})}" method="post">
                            <input type="hidden" name="orderStatus" value="PROCESSED">
                            <button type="submit" th:if="${order.status != 'PROCESSED'}">Mark as Processed</button>
                            <span th:if="${order.status == 'PROCESSED'}">Processed</span>
                        </form>
                    </td>
                </tr>
            </table>
        </section>
    </main>

    <!-- Section 3: Footer -->
    <footer class="footer">
      <p>&copy; 2025 Elvin Jiby</p>
    </footer>
</body>
</html>
