<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Bebas+Neue&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="/css/cart.css">
</head>
<body>
    <!-- Section 1: Header -->
    <section id="header" class="header">
        <nav>
            <a th:href="@{#}" title="Scroll to top of page"><img src="/images/logo.png" class="logo" alt="Segue Logo"></a>
            <ul>
                <li><a th:href="@{/customer/home}" title="Go to Home Page">Home</a></li>
                <li><a th:href="@{/customer/products}" title="Go to Products Page">Shop</a></li>
                <li><a th:href="@{/customer/orders}" title="Go to Orders Page">Orders</a></li>
            </ul>
            <a th:href="@{/customer/cart}" title="View Cart" aria-label="View Cart"><i class='bx bx-cart' ></i></a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout" title="Log Out" aria-label="Log Out">
                    <i class='bx bx-log-out'></i>
                </button>
            </form>
        </nav>
    </section>

    <main>
        <!-- Section 2: Cart -->
        <section class="cart">
            <h2>beeg cart wow</h2>
            <table>
                <tr>
                    <th>Cover</th>
                    <th>Name</th>
                    <th>Artist</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Actions</th>
                </tr>
                <tr th:each="cartItem : ${cartItems}">
                    <td><img th:src="${cartItem.product.albumCoverURL}" width="50" alt="album cover"></td>
                    <td th:text="${cartItem.product.name}"></td>
                    <td th:text="${cartItem.product.artist}"></td>
                    <td th:text="'$' + ${cartItem.product.price}"></td>
                    <td>
                        <form th:action="@{/customer/cart/update/{id}(id=${cartItem.product.id})}" method="post">
                            <input type="number" name="quantity" th:value="${cartItem.quantity}" min="1">
                            <button type="submit">Update</button>
                        </form>
                    </td>
                    <td th:text="'$' + ${cartItem.totalPrice}"></td>
                    <td>
                        <form th:action="@{/customer/cart/remove/{id}(id=${cartItem.product.id})}" method="post">
                            <button type="submit">Remove</button>
                        </form>
                    </td>
                </tr>
            </table>

            <h3>Total: <span th:text="'$' + ${totalPrice}"></span></h3>
            <form th:action="@{/customer/cart/clear}" method="post">
                <button type="submit">Clear Cart</button>
            </form>

            <a th:href="@{/customer/products}" title="Back to Products">Continue Shopping</a>
        </section>
    </main>

    <!-- Section 3: Footer -->
    <footer class="footer">
        <p>&copy; 2025 Elvin Jiby</p>
    </footer>
</body>
</html>
