<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Bebas+Neue&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        /*
        --malachite: #1bd96aff;
        --british-racing-green: #134229ff;
        --azure-web: #ecf9fbff;
        --french-gray: #b0bac5ff;
        --cadet-gray: #96a2b0ff;
        --night: #101816
        --black: #000000ff;
        */
        .modal {
            display: none; /* hidden by default */
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #101816;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }
        .modal-content .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        body {
            font-family: Archivo Narrow, arial;
            background: #134229ff url("/images/login-bg.png") center;
            background-size: cover;
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-family: Bebas Neue;
            font-size: 50px;
            text-align: center;
            color: #ecf9fbff;
        }

        p {
            font-family: Archivo Narrow;
            font-size: 20px;
            color: #ecf9fbff;
        }

        .error p {
            color: aqua;
            font-size: 20px;
        }

        .login-form {
            width: 400px;
            padding: 40px;
            background-color: #101816;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(8, 255, 193, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .register-form {
            width: 400px;
            padding: 40px;
            background-color: #101816;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(8, 255, 193, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }


        i {
            color: #000000ff;
            background-color: #1bd96aff;
            padding: 5px 5px;
            border-radius: 20%;
        }

        a {
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
            color: #b0bac5;
        }

        a:hover {
            color: #ecf9fbff;
        }
    </style>
</head>
<body>
    <form id="login-form" class="login-form" th:action="@{/login}" method="post">
        <h1>Login</h1>

        <div th:if="${param.error}" class="error">
            <p th:text="${param.message != null ? param.message : 'Invalid username or password'}"></p>
        </div>

        <div class="input-field">
            <i class='bx bxs-user'></i>     
            <input type="text" name="username" id="username" placeholder="Username" required>
        </div>

        <div class="input-field">
            <i class='bx bxs-lock-alt' ></i>
            <input type="password" name="password" id="password" placeholder="Password" required>
        </div>

        <input type="submit" id="submit" class="submit" value="Log In">
        <div class="register">
            <p>Don't have an account? 
                <a th:href="@{/register}">
                    <b>Register</b>
                </a>
            </p>
        </div>
    </form>

    <div id="loginSuccessModal" class="modal" th:if="${param.loginSuccess}">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p>Login successful!</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function(){
            var modal = document.getElementById("loginSuccessModal");
            if(modal) {
                // Show modal if it exists (i.e. if loginSuccess query parameter is set)
                modal.style.display = "block";

                // Add event to the close button
                var closeButton = modal.querySelector(".close");
                closeButton.addEventListener("click", function(){
                    modal.style.display = "none";
                });

                // Optionally, hide the modal automatically after 3 seconds
                setTimeout(function(){
                    modal.style.display = "none";
                }, 10000);
            }
        });
    </script>
</body>
</html>
