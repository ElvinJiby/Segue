<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Bebas+Neue&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        body {
            font-family: Archivo Narrow, arial;
            background: #134229ff url("/images/login-bg.png") center;
            background-size: cover;
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-family: Bebas Neue;
            font-size: 50px;
            text-align: center;
            color: #ecf9fbff;
        }

        p {
            font-family: Archivo Narrow;
            font-size: 20px;
            color: #ecf9fbff;
        }

        .error p {
            color: aqua;
            font-size: 20px;
        }

        .login-form {
            width: 400px;
            padding: 40px;
            background-color: #101816;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(8, 255, 193, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .register-form {
            width: 400px;
            padding: 40px;
            background-color: #101816;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(8, 255, 193, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }


        i {
            color: #000000ff;
            background-color: #1bd96aff;
            padding: 5px 5px;
            border-radius: 20%;
        }

        a {
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
            color: #b0bac5;
        }

        a:hover {
            color: #ecf9fbff;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            padding-top: 100px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }
        .modal-content {
            background-color: #101816;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
        }
        .modal .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <form id="register-form" class="register-form" th:action="@{process_register}" th:object="${user}" method="post">
        <h1>Register</h1>

        <div th:if="${errorMessage}" class="error">
            <p th:text="${errorMessage}"></p>
        </div>
        <div th:if="${param.error}" class="error">
            Invalid username or password
        </div>
        <div th:if="${param.logout}" class="error">
            You have been logged out.
        </div>

        <div class="input-field">
            <i class='bx bxs-user'></i>
            <label>
                <input type="text" th:field="*{username}" placeholder="Username" required>
            </label>
        </div>

        <div class="input-field">
            <i class='bx bxs-lock-alt' ></i>
            <label>
                <input type="password" th:field="*{password}" placeholder="Password" required>
            </label>
        </div>

        <input type="submit" id="submit" class="submit" value="Register">
        <div class="login">
            <p>Already have an account? 
                <a th:href="@{/login}">
                    <b>Log in</b>
                </a>
            </p>
        </div>
    </form>

    <div id="successModal" class="modal" th:if="${successMessage}">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p th:text="${successMessage}">Registration successful!</p>
            <p><a th:href="@{/login}">Click here to log in!</a></p>
        </div>
    </div>


    <script>
        document.addEventListener("DOMContentLoaded", function(){
            var modal = document.getElementById("successModal");
            if(modal) {
                modal.style.display = "block";

                // When the user clicks on <span> (x), close the modal
                var closeButton = modal.querySelector(".close");
                closeButton.addEventListener('click', function() {
                    modal.style.display = "none";
                });

                // Optionally, hide the modal after a few seconds:
                setTimeout(function(){
                    modal.style.display = "none";
                }, 3000);
            }
        });
    </script>
</body>
</html>
