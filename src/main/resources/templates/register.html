<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Bebas+Neue&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        /*
        --malachite: #1bd96aff;
        --british-racing-green: #134229ff;
        --azure-web: #ecf9fbff;
        --french-gray: #b0bac5ff;
        --cadet-gray: #96a2b0ff;
        --night: #101816
        --black: #000000ff;
        */
        
        /* general */
        body {
            font-family: Archivo Narrow, arial;
            background: url("/images/login-bg.png"), #134229ff;
            background-position: center;
            background-size: cover;
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-family: Bebas Neue;
            font-size: 50px;
            text-align: center;
            color: #ecf9fbff;
        }

        p {
            font-family: Archivo Narrow;
            font-size: 20px;
            color: #ecf9fbff;
        }
        a {
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
            color: #b0bac5;
        }
        a:hover {
            color: #ecf9fbff;
        }

        /* form */
        .register-form {
            width: 400px;
            padding: 40px;
            background-color: #101816;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(8, 255, 193, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .register-form i {
            color: #000000ff;
            background-color: #1bd96aff;
            padding: 5px 5px;
            border-radius: 20%;
        }

        /* popup for successful register */
        .success-popup {
            position: absolute;
            width: 380px;
            padding: 20px;
            background-color: #4b976e;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(8, 255, 193, 0.25);
            opacity: 0;
        }
        .popup-content {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 10px;
            text-align: center;
            padding-top: 40px;
        }
        .icon {
            font-size: 50px;
            color: #1bd96aff;
            background-color: #ecf9fbff;
            border-radius: 50%;
            width: 60px;
            height: 60px;

        }
        .icon i {
            border-radius: 0;
        }
        .title {
            font-family: Bebas Neue;
            font-size: 30px;
            font-weight: 600;
            color: #ecf9fbff;
        }
        .msg {
            font-family: Archivo Narrow;
            font-size: 20px;
            color: #ecf9fbff;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <form id="register-form" class="register-form" th:action="@{process_register}" th:object="${user}" method="post">
        <h1>Register</h1>

        <div th:if="${errorMessage}" class="error">
            <p th:text="${errorMessage}"></p>
        </div>
        <div th:if="${param.error}" class="error">
            Invalid username or password
        </div>

        <div class="input-field">
            <i class='bx bxs-user'></i>
            <label>
                <input type="text" th:field="*{username}" placeholder="Username" required>
            </label>
        </div>

        <div class="input-field">
            <i class='bx bxs-lock-alt' ></i>
            <label>
                <input type="password" th:field="*{password}" placeholder="Password" required>
            </label>
        </div>

        <input type="submit" id="submit" class="submit" value="Register">
        <div class="login">
            <p>Already have an account? 
                <a th:href="@{/login}"><b>Log in</b></a>
            </p>
        </div>
    </form>
</body>
</html>
