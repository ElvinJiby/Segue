<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Bebas+Neue&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="/css/products.css">
</head>
<body>
    <!-- Section 1: Header -->
    <section id="header" class="header">
        <nav>
            <a th:href="@{#}" title="Scroll to top of page"><img src="/images/logo.png" class="logo" alt="Segue Logo"></a>
            <ul>
                <li><a th:href="@{/admin/home}" title="Go to Home Page">Home</a></li>
                <li><a th:href="@{/admin/products}" title="Go to Products Page">Shop</a></li>
                <li><a th:href="@{/admin/orders}" title="Go to Orders Page">Orders</a></li>
            </ul>
            <a th:href="@{/admin/contacts}" title="View Cart" aria-label="View Cart"><i class='bx bx-cart' ></i></a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout" title="Log Out" aria-label="Log Out">
                    <i class='bx bx-log-out'></i>
                </button>
            </form>
        </nav>
    </section>

    <main>
        <!-- Section 2: Add New Product -->
        <section class="new-product">
            <h2>Add New Products</h2>
            <form th:action="@{/admin/products/add}" th:object="${newProduct}" method="post">
                <div class="input-field">
                    <label>Name:</label>
                    <input type="text" th:field="*{name}" placeholder="Enter name of album" required>
                </div>

                <div class="input-field">
                    <label>Artist:</label>
                    <input type="text" th:field="*{artist}" placeholder="Enter artist(s) names" required>
                </div>

                <div class="input-field">
                    <label>Price:</label>
                    <input type="number" th:field="*{price}" placeholder="Enter price (only decimal, no need for symbol)" required>
                </div>

                <div class="input-field">
                    <label>Description:</label>
                    <textarea th:field="*{description}" placeholder="Enter description" required></textarea>
                </div>

                <div class="input-field">
                    <label>Album Cover URL:</label>
                    <input type="text" th:field="*{albumCoverURL}" placeholder="Enter image url">
                </div>

                <button type="submit">Add Album</button>
            </form>
        </section>

        <!-- Section 3: Show all products -->
        <section class="existing-products">
            <h2>All Products</h2>
            <table class="products-table">
                <tr>
                    <th>Cover</th>
                    <th>Name</th>
                    <th>Artist</th>
                    <th>Price</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
                <tr th:each="product : ${productsList}">
                    <td>
                        <img th:src="${product.albumCoverURL}" alt="Album Cover" width="50">
                    </td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.artist}"></td>
                    <td th:text="'$' + ${product.price}"></td>
                    <td th:text="${product.description}"></td>
                    <td>
                        <a th:href="@{/admin/products/edit/{id}(id=${product.id})}">Edit</a>

                        <form th:action="@{/admin/products/toggle-visibility/{id}(id=${product.id})}" method="post" style="display:inline;">
                            <button type="submit" th:text="${product.hidden} ? 'Unhide' : 'Hide'"></button>
                        </form>
                    </td>
                </tr>
            </table>
        </section>
    </main>

    <!-- Section 4: Footer -->
    <footer class="footer">
        <p>&copy; 2025 Elvin Jiby</p>
    </footer>
</body>
</html>
