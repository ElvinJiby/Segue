version: '3.8'
services:
  app:
    build: .
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/marketplace?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Ckwe!Kxq*3jF@X7YrRU

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: Ckwe!Kxq*3jF@X7YrRU
      MYSQL_DATABASE: marketplace
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql  # Persist MySQL data
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:  # Declare the volume
